server {
    listen __PORT__ default_server;
    server_name _;
    root /var/www/html/public;
    index index.php index.html;
    client_max_body_size 25m;

    access_log /dev/stdout;
    error_log /dev/stderr warn;

    location ^~ /_next/ {
        include /etc/nginx/render-next-proxy-params.conf;
    }

    location ^~ /images/ {
        include /etc/nginx/render-next-proxy-params.conf;
    }

    # Laravel owns backend endpoints; Next.js owns every user-facing page.
    location / {
        include /etc/nginx/render-next-proxy-params.conf;
    }

    location ^~ /api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /sanctum/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /auth/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /login {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /logout {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /register {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /up {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param HTTP_X_FORWARDED_PROTO $render_next_forwarded_proto;
        fastcgi_param HTTP_X_FORWARDED_HOST $http_host;
        fastcgi_param HTTP_X_FORWARDED_FOR $proxy_add_x_forwarded_for;
        fastcgi_pass 127.0.0.1:9000;
    }

    location ~ /\. {
        deny all;
    }
}
