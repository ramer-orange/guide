openapi: 3.1.0
info:
  title: Guide Itinerary API
  version: 1.0.0
  description: |
    Laravel session-authenticated JSON API. All routes use the Laravel web session and CSRF middleware.
    Send credentials and the X-XSRF-TOKEN header for state-changing requests. Create/update bodies are
    multipart/form-data with a JSON `payload` part. Uploads use `files[<plans[].client_id>][]` parts.
    `payload` must include every collection; collections are full replacements and [] clears them.
    Existing row IDs retain records; omitted existing IDs delete rows in the caller's scope. For a plan,
    `existing_file_ids` is the exact list to retain; omitted existing attachments are deleted.
  x-csrf-cookie-url: /sanctum/csrf-cookie
servers:
  - url: /api/v1
paths:
  /session:
    get:
      operationId: getSession
      summary: Return current session state
      responses:
        '200':
          description: Current guest or authenticated session
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Session' }
  /itineraries:
    get:
      operationId: listItineraries
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Itineraries owned by or shared for editing with the current user
          content:
            application/json:
              schema:
                type: object
                required: [itineraries]
                properties:
                  itineraries:
                    type: array
                    items: { $ref: '#/components/schemas/ItinerarySummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      operationId: createItinerary
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ItineraryMultipart' }
      responses:
        '201':
          description: Created itinerary
          content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /itineraries/{itineraryId}:
    parameters:
      - $ref: '#/components/parameters/ItineraryId'
    get:
      operationId: getItinerary
      responses:
        '200':
          description: Itinerary visible to the current user or shared viewer session
          content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      operationId: updateItinerary
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ItineraryMultipart' }
      responses:
        '200':
          description: Updated itinerary
          content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      operationId: updateItineraryMultipart
      description: Multipart-compatible method-override endpoint. `_method=PUT` is accepted; POST also updates.
      security: [{ cookieAuth: [] }]
      requestBody: { $ref: '#/components/requestBodies/ItineraryMultipart' }
      responses:
        '200':
          description: Updated itinerary
          content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: deleteItinerary
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Deleted itinerary }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /itineraries/{itineraryId}/files/{fileId}:
    parameters:
      - $ref: '#/components/parameters/ItineraryId'
      - name: fileId
        in: path
        required: true
        schema: { type: integer }
    get:
      operationId: getItineraryFile
      responses:
        '200': { description: Authorized attachment bytes, with Content-Disposition filename }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /packing-templates:
    get:
      operationId: listPackingTemplates
      responses:
        '200':
          description: Existing packing checklist templates
          content:
            application/json:
              schema:
                type: object
                required: [templates]
                properties:
                  templates:
                    type: array
                    items:
                      type: object
                      required: [type, label, items]
                      properties:
                        type: { type: string, enum: [domestic, overseas] }
                        label: { type: string, examples: [国内旅行] }
                        items: { type: array, items: { type: string } }
  /itineraries/{itineraryId}/members:
    parameters:
      - $ref: '#/components/parameters/ItineraryId'
    post:
      operationId: addMember
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties: { email: { type: string, format: email } }
      responses:
        '201':
          description: Member added (or already present)
          content:
            application/json:
              schema:
                type: object
                properties: { member: { $ref: '#/components/schemas/Member' } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /itineraries/{itineraryId}/members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/ItineraryId'
      - name: memberId
        in: path
        required: true
        schema: { type: integer }
    delete:
      operationId: removeMember
      security: [{ cookieAuth: [] }]
      responses:
        '204': { description: Member removed }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /itineraries/{itineraryId}/shared-access:
    parameters:
      - $ref: '#/components/parameters/ItineraryId'
    get:
      operationId: getSharedAccessStatus
      responses:
        '200':
          description: Minimal metadata for the active shared itinerary
          content:
            application/json:
              schema:
                type: object
                required: [id, title, available]
                properties:
                  id: { type: string, format: uuid }
                  title: { type: string }
                  available: { type: boolean, const: true }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      operationId: verifySharedAccess
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [shared_password]
              properties: { shared_password: { type: string } }
      responses:
        '200':
          description: Password accepted and shared itinerary session granted
          content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /itineraries/{itineraryId}/viewer-share:
    parameters:
      - $ref: '#/components/parameters/ItineraryId'
    put:
      operationId: setViewerShare
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: At least one field is required. A password is required when creating or reissuing an elapsed share; active shares may update expiry without rotating the password.
              properties:
                shared_password: { type: [string, 'null'], minLength: 8, maxLength: 32 }
                shared_password_confirmation: { type: [string, 'null'], minLength: 8, maxLength: 32 }
                expires_at: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Viewer share configured
          content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      operationId: revokeViewerShare
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Viewer share revoked and existing access versions invalidated
          content: { application/json: { schema: { $ref: '#/components/schemas/Itinerary' } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: laravel_session
      description: Laravel session cookie; include X-XSRF-TOKEN for state-changing requests.
  parameters:
    ItineraryId:
      name: itineraryId
      in: path
      required: true
      schema: { type: string, format: uuid }
  requestBodies:
    ItineraryMultipart:
      required: true
      content:
        multipart/form-data:
          schema:
            type: object
            required: [payload]
            properties:
              payload:
                type: string
                contentMediaType: application/json
                contentSchema: { $ref: '#/components/schemas/ItinerarySave' }
                description: JSON-encoded ItinerarySave object (all collections required, including empty arrays).
              _method:
                type: string
                enum: [PUT]
          encoding:
            payload: { contentType: application/json }
          examples:
            save:
              summary: JSON payload part; plan upload parts use `files[client-plan-1][]`
              value:
                payload: '{"title":"Tokyo","overview_text":"Trip notes","template_type":"domestic","plans":[{"client_id":"client-plan-1","date":"2026-10-05","time":"09:30","title":"Visit","content":"","order":0,"existing_file_ids":[]}],"packing_items":[{"name":"Passport","is_checked":false,"order":0}],"souvenirs":[],"notes":[]}'
  schemas:
    Session:
      type: object
      required: [authenticated, user, auth_error]
      properties:
        authenticated: { type: boolean }
        user:
          oneOf:
            - type: 'null'
            - type: object
              required: [id, name, email]
              properties:
                id: { type: integer }
                name: { type: string }
                email: { type: string, format: email }
        auth_error: { type: [string, 'null'] }
    ItinerarySummary:
      type: object
      required: [id, title, overview_text, created_at, updated_at, permissions]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        overview_text: { type: [string, 'null'] }
        created_at: { type: [string, 'null'], format: date-time }
        updated_at: { type: [string, 'null'], format: date-time }
        permissions:
          type: object
          required: [can_edit, can_delete]
          properties:
            can_edit: { type: boolean }
            can_delete: { type: boolean }
    ItinerarySave:
      type: object
      required: [title, overview_text, template_type, plans, packing_items, souvenirs, notes]
      properties:
        title: { type: string, maxLength: 255 }
        overview_text: { type: [string, 'null'] }
        template_type: { type: [string, 'null'], maxLength: 255 }
        plans:
          type: array
          items:
            type: object
            required: [client_id, order, existing_file_ids]
            properties:
              id: { type: integer, description: Existing plan row ID, omitted for new rows. }
              client_id: { type: string, pattern: '^[A-Za-z0-9_-]{1,100}$' }
              date: { type: [string, 'null'], format: date }
              time: { type: [string, 'null'], pattern: '^\\d{2}:\\d{2}$' }
              title: { type: [string, 'null'], maxLength: 255 }
              content: { type: [string, 'null'] }
              order: { type: integer, minimum: 0 }
              existing_file_ids: { type: array, items: { type: integer }, description: Exact attachment IDs to keep. }
        packing_items:
          type: array
          items:
            type: object
            required: [name, is_checked, order]
            properties:
              id: { type: integer, description: Existing caller-owned row ID, omitted for new rows. }
              name: { type: [string, 'null'], maxLength: 255 }
              is_checked: { type: boolean }
              order: { type: integer, minimum: 0 }
        souvenirs:
          type: array
          items:
            type: object
            required: [name, is_checked, order]
            properties:
              id: { type: integer, description: Existing row ID, omitted for new rows. }
              name: { type: [string, 'null'], maxLength: 255 }
              is_checked: { type: boolean }
              order: { type: integer, minimum: 0 }
        notes:
          type: array
          items:
            type: object
            required: [title, text, order]
            properties:
              id: { type: integer, description: Existing row ID, omitted for new rows. }
              title: { type: [string, 'null'], maxLength: 255 }
              text: { type: [string, 'null'] }
              order: { type: integer, minimum: 0 }
        shared_password: { type: string, minLength: 8, maxLength: 32, description: Optional on create only; confirmed by the matching confirmation field. }
        shared_password_confirmation: { type: string, minLength: 8, maxLength: 32 }
        viewer_share_expires_at: { type: [string, 'null'], format: date-time }
    Itinerary:
      type: object
      required: [id, title, overview_text, template_type, plans, packing_items, souvenirs, notes, members, permissions, viewer_share]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        overview_text: { type: [string, 'null'] }
        template_type: { type: [string, 'null'] }
        plans:
          type: array
          items:
            type: object
            required: [id, date, time, title, content, order, files]
            properties:
              id: { type: integer }
              date: { type: [string, 'null'], format: date }
              time: { type: [string, 'null'], pattern: '^\\d{2}:\\d{2}$' }
              title: { type: [string, 'null'] }
              content: { type: [string, 'null'] }
              order: { type: integer }
              files:
                type: array
                items:
                  type: object
                  required: [id, file_name, url]
                  properties:
                    id: { type: integer }
                    file_name: { type: string }
                    url: { type: string, format: uri-reference }
        packing_items:
          type: array
          description: Only the authenticated caller's personal list; empty for shared viewers.
          items: { $ref: '#/components/schemas/ChecklistItem' }
        souvenirs:
          type: array
          items: { $ref: '#/components/schemas/ChecklistItem' }
        notes:
          type: array
          items:
            type: object
            required: [id, title, text, order]
            properties:
              id: { type: integer }
              title: { type: [string, 'null'] }
              text: { type: [string, 'null'] }
              order: { type: integer }
        members:
          type: array
          description: Member identities are included only for users allowed to manage members.
          items: { $ref: '#/components/schemas/Member' }
        permissions:
          type: object
          required: [can_edit, can_delete, can_manage_members, can_manage_viewer_share]
          properties:
            can_edit: { type: boolean }
            can_delete: { type: boolean }
            can_manage_members: { type: boolean }
            can_manage_viewer_share: { type: boolean }
        viewer_share:
          type: object
          required: [active]
          properties:
            active: { type: boolean }
            expires_at: { type: [string, 'null'], format: date-time, description: Included for the owner only. }
    ChecklistItem:
      type: object
      required: [id, name, is_checked, order]
      properties:
        id: { type: integer }
        name: { type: [string, 'null'] }
        is_checked: { type: boolean }
        order: { type: integer }
    Member:
      type: object
      required: [id, user, role]
      properties:
        id: { type: integer }
        user:
          type: object
          required: [id, name, email]
          properties:
            id: { type: integer }
            name: { type: string }
            email: { type: string, format: email }
        role: { type: string, enum: [owner, member] }
    Error:
      type: object
      required: [message]
      properties:
        message: { type: string }
        errors:
          type: object
          additionalProperties: { type: array, items: { type: string } }
  responses:
    Unauthorized:
      description: Authentication required
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    Forbidden:
      description: Authenticated user does not have the required permission
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    NotFound:
      description: Resource does not exist or is outside the itinerary scope
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    ValidationError:
      description: Invalid request body or shared-access password
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
    TooManyRequests:
      description: Shared-access attempts are rate limited
      content: { application/json: { schema: { $ref: '#/components/schemas/Error' } } }
