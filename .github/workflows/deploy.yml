name: CI # ワークフローの名前（GitHub Actions画面に表示される）

on: # トリガー条件の定義
  push: # すべてのブランチへのpushで起動。Render連携ブランチも検証する
  pull_request: # Pull Requestでも同じ検証を実行

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs: # 実行するジョブの一覧

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: guide_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guide_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: PHPセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_sqlite, pdo_pgsql

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: アプリ検証
        run: |
          php scripts/check-php-runtime.php
          node frontend/scripts/check-node-runtime.mjs
          node --test frontend/scripts/check-node-runtime.test.mjs
          composer install --no-interaction --prefer-dist
          npm ci --prefix frontend
          npm --prefix frontend run test
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run build
          composer audit
          npm audit --prefix frontend --omit=dev
          APP_KEY=base64:54QOuuDvHgF5PcqsqkwmaUGE6vtM28BKGPFItCUxCsk= DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432 DB_DATABASE=guide_test DB_USERNAME=postgres DB_PASSWORD=postgres php artisan test

  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify production runtimes
        run: |
          docker build --pull -f Dockerfile.render-next -t guide-security:ci .
          docker run --rm --entrypoint sh guide-security:ci -c 'php scripts/check-php-runtime.php && node frontend/scripts/check-node-runtime.mjs && php-fpm -v'

  infra-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: CDKの型チェックとテスト
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  # mainへのpush時に、ECRへのイメージpush → Migrationタスク → cdk deploy（ECS更新）の順で本番へ反映する。
  # AWS課金停止中のため、リポジトリ変数 AWS_DEPLOY_ENABLED が 'true' のときだけ動く。
  # 初回構築とGuideGovernanceStackは手動でデプロイする（docs/AWS_DEPLOYMENT_DONE.md）。
  deploy:
    runs-on: ubuntu-latest
    needs: [validate, runtime-image, infra-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ENABLED == 'true' }}
    concurrency:
      group: aws-production-deploy
      cancel-in-progress: false
    env:
      AWS_REGION: ap-northeast-1
      STACK_NAME: GuideStack
      IMAGE_TAG: ${{ github.sha }}

    steps:
      - uses: actions/checkout@v4

      - name: AWS認証
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }} # GuideStackのOutput GitHubActionsRoleArn
          aws-region: ${{ env.AWS_REGION }}

      - name: CDK Output取得
        id: stack
        run: |
          if ! outputs=$(aws cloudformation describe-stacks \
            --stack-name "$STACK_NAME" \
            --query 'Stacks[0].Outputs' \
            --output json); then
            echo "::error::$STACK_NAME がありません。初回構築は docs/AWS_DEPLOYMENT_DONE.md の手順で手動実行してください。"
            exit 1
          fi

          get_output() {
            value=$(echo "$outputs" | jq -r ".[] | select(.OutputKey == \"$1\") | .OutputValue")
            if [ -z "$value" ]; then
              echo "::error::Output $1 が見つかりません"
              exit 1
            fi
            echo "$value"
          }

          {
            echo "application_url=$(get_output ApplicationUrl)"
            echo "repository_uri=$(get_output ApplicationRepositoryUri)"
            echo "cluster=$(get_output EcsClusterName)"
            echo "subnets=$(get_output PublicSubnetIds)"
            echo "security_group=$(get_output TaskSecurityGroupId)"
            echo "migration_log_group=$(get_output MigrationLogGroupName)"
          } >> "$GITHUB_OUTPUT"

      - name: ECRログイン
        uses: aws-actions/amazon-ecr-login@v2

      - name: QEMUセットアップ
        uses: docker/setup-qemu-action@v3

      - name: Docker Buildxセットアップ
        uses: docker/setup-buildx-action@v3

      # ECRのタグは上書き不可なので、同じコミットの再実行ではビルドを省略する。
      - name: Docker imageをECRへpush
        id: image
        env:
          REPOSITORY_URI: ${{ steps.stack.outputs.repository_uri }}
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
        run: |
          image_uri="${REPOSITORY_URI}:${IMAGE_TAG}"
          repository_name="${REPOSITORY_URI#*/}"

          if aws ecr describe-images \
            --repository-name "$repository_name" \
            --image-ids "imageTag=${IMAGE_TAG}" > /dev/null 2>&1; then
            echo "${image_uri} は既にあるためビルドを省略します"
          else
            # NEXT_PUBLIC_* はビルド時に埋め込まれるため、本番URLを渡す。
            docker buildx build \
              --platform linux/arm64 \
              --build-arg "NEXT_PUBLIC_SITE_URL=${APPLICATION_URL}" \
              --tag "$image_uri" \
              --push \
              .
          fi
          echo "image_uri=${image_uri}" >> "$GITHUB_OUTPUT"

      # 新しいイメージでMigrationタスクを1回だけ実行し、成功してからWebタスクを入れ替える。
      # マイグレーションは旧コードと新コードの両方で動く形（追加→移行→削除の段階的変更）で書くこと。
      - name: Migrationタスク実行
        env:
          IMAGE_URI: ${{ steps.image.outputs.image_uri }}
          CLUSTER: ${{ steps.stack.outputs.cluster }}
          SUBNETS: ${{ steps.stack.outputs.subnets }}
          SECURITY_GROUP: ${{ steps.stack.outputs.security_group }}
          LOG_GROUP: ${{ steps.stack.outputs.migration_log_group }}
        run: |
          task_definition=$(aws ecs describe-task-definition \
            --task-definition guide-production-migration \
            --query taskDefinition \
            --output json \
            | jq --arg image "$IMAGE_URI" '
                .containerDefinitions[0].image = $image
                | {family, taskRoleArn, executionRoleArn, networkMode, containerDefinitions,
                   volumes, placementConstraints, requiresCompatibilities, cpu, memory, runtimePlatform}
                | with_entries(select(.value != null))')

          task_definition_arn=$(aws ecs register-task-definition \
            --cli-input-json "$task_definition" \
            --query taskDefinition.taskDefinitionArn \
            --output text)

          task_arn=$(aws ecs run-task \
            --cluster "$CLUSTER" \
            --launch-type FARGATE \
            --task-definition "$task_definition_arn" \
            --network-configuration "awsvpcConfiguration={subnets=[${SUBNETS}],securityGroups=[${SECURITY_GROUP}],assignPublicIp=ENABLED}" \
            --query 'tasks[0].taskArn' \
            --output text)
          echo "Migration task: $task_arn"

          aws ecs wait tasks-stopped --cluster "$CLUSTER" --tasks "$task_arn"

          task_id="${task_arn##*/}"
          aws logs get-log-events \
            --log-group-name "$LOG_GROUP" \
            --log-stream-name "migration/migration/${task_id}" \
            --start-from-head \
            --query 'events[].message' \
            --output text || true

          exit_code=$(aws ecs describe-tasks \
            --cluster "$CLUSTER" \
            --tasks "$task_arn" \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)
          if [ "$exit_code" != "0" ]; then
            aws ecs describe-tasks --cluster "$CLUSTER" --tasks "$task_arn" \
              --query 'tasks[0].{stoppedReason: stoppedReason, containers: containers[].{name: name, exitCode: exitCode, reason: reason}}'
            echo "::error::Migrationが失敗しました（exit code: ${exit_code}）"
            exit 1
          fi

      - name: Node.jsセットアップ
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      # イメージタグだけを渡す。desiredCountを渡さないので、稼働中のタスク数は変わらない。
      # CloudFormation Parameterは前回の値を引き継ぐ（SlackWebhookUrlも同じ）。
      # enableSlackAlertsは合成時に効くcontextなので、付けずにデプロイするとSlack関連のリソースが削除される。
      # 手動で有効化した状態を維持するため、リポジトリ変数 SLACK_ALERTS_ENABLED の値をそのまま引き継ぐ。
      # 変数は env: 経由で渡す。run: の本文へ直接展開すると、引用符や改行を含む値が
      # バックスラッシュ継続のコマンドを壊す（CDK側で弾かれず、意図しない形で実行される）。
      # 受け付けるのは小文字の true / false だけで、それ以外はCDKが例外を投げてデプロイが失敗する。
      - name: CDKデプロイ（ECS Serviceの更新）
        working-directory: infra
        env:
          SLACK_ALERTS_ENABLED: ${{ vars.SLACK_ALERTS_ENABLED || 'false' }}
        run: |
          npm ci
          npx cdk deploy "$STACK_NAME" \
            -c "appImageTag=${IMAGE_TAG}" \
            -c "enableSlackAlerts=${SLACK_ALERTS_ENABLED}" \
            --require-approval never

      - name: 本番の疎通確認
        env:
          APPLICATION_URL: ${{ steps.stack.outputs.application_url }}
        run: |
          curl --fail --silent --show-error \
            --retry 10 --retry-delay 10 --retry-all-errors \
            "${APPLICATION_URL}/healthz"

  # mainへのpushでいずれかのジョブが失敗したときだけSlackへ通知する。報告専用で、ワークフローの成否は変えない。
  # deployはmain以外ではスキップされるため、always() と contains(needs.*.result, 'failure') の
  # 組み合わせでスキップを失敗扱いしない。
  # 通知をmainに限るのは意図的。pull_requestの失敗はPR画面で見えるので除いているが、
  # PRブランチへのpushはpushイベントも起こすため、ref を絞らないと同じコミットが結局通知され、
  # 障害用チャンネルが日常の開発CI失敗で埋まる。feature ブランチの失敗はActions画面で見る。
  # （同じ理由の通知を .github/workflows/dependency-security.yml にも置いている。
  #   共通化せず意図的に複製している。理由はあちら側のコメントを参照。）
  # このジョブがgreenの実行を赤くすることはない。needsのどれかが既にfailureのときだけ走り、
  # かつこのファイルのどのジョブも continue-on-error を使っていないため（使うと失敗が
  # success扱いになり、この前提が崩れる）。continue-on-error は足さない。送信失敗を隠してしまう。
  notify-failure:
    runs-on: ubuntu-latest
    needs: [validate, runtime-image, infra-test, deploy]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    steps:
      - name: Slackへ失敗を通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # シークレットが未登録のあいだは何もせず正常終了する（通知の有無でCIを落とさない）。
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "シークレット SLACK_WEBHOOK_URL が未登録のため、Slack通知を省略します"
            exit 0
          fi

          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result == "failure") | .key)
            | join(", ")')

          payload=$(jq -n \
            --arg workflow "$WORKFLOW_NAME" \
            --arg jobs "$failed_jobs" \
            --arg ref "$REF_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '{text: ":rotating_light: \($workflow) が失敗しました\n失敗ジョブ: \($jobs)\nブランチ: \($ref)\nコミット: \($sha)\n実行者: \($actor)\n実行ログ: \($url)"}')

          curl --fail --silent --show-error --max-time 5 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
