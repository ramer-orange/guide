name: CI # ワークフローの名前（GitHub Actions画面に表示される）

on: # トリガー条件の定義
  push: # すべてのブランチへのpushで起動。Render連携ブランチも検証する
  pull_request: # Pull Requestでも同じ検証を実行

permissions:
  contents: read
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs: # 実行するジョブの一覧

  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: guide_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d guide_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: PHPセットアップ
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3.36'
          extensions: pdo_sqlite, pdo_pgsql

      - name: Node.jsセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: アプリ検証
        run: |
          php scripts/check-php-runtime.php
          node frontend/scripts/check-node-runtime.mjs
          node --test frontend/scripts/check-node-runtime.test.mjs
          composer install --no-interaction --prefer-dist
          npm ci --prefix frontend
          npm --prefix frontend run test
          npm --prefix frontend run typecheck
          npm --prefix frontend run lint
          npm --prefix frontend run build
          composer audit
          npm audit --prefix frontend --omit=dev
          APP_KEY=base64:54QOuuDvHgF5PcqsqkwmaUGE6vtM28BKGPFItCUxCsk= DB_CONNECTION=pgsql DB_HOST=127.0.0.1 DB_PORT=5432 DB_DATABASE=guide_test DB_USERNAME=postgres DB_PASSWORD=postgres php artisan test

  runtime-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and verify production runtimes
        run: |
          docker build --pull -f Dockerfile.render-next -t guide-security:ci .
          docker run --rm --entrypoint sh guide-security:ci -c 'php scripts/check-php-runtime.php && node frontend/scripts/check-node-runtime.mjs && php-fpm -v'

  infra-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Node.jsセットアップ
        uses: actions/setup-node@v7
        with:
          node-version: '22.23.4'
          cache: 'npm'
          cache-dependency-path: infra/package-lock.json

      - name: CDKの型チェックとテスト
        working-directory: infra
        run: |
          npm ci
          npx tsc --noEmit
          npm test

  # mainへのpush時に、まず staging、成功したら production の順でデプロイする。
  # デプロイの中身は .github/workflows/aws-deploy.yml（ECRへpush → Migrationタスク → cdk deploy）。
  # AWS課金停止中のため、リポジトリ変数が 'true' の環境だけ動く
  # （staging は AWS_STAGING_DEPLOY_ENABLED、production は AWS_DEPLOY_ENABLED）。
  deploy-staging:
    needs: [validate, runtime-image, infra-test]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AWS_STAGING_DEPLOY_ENABLED == 'true' }}
    uses: ./.github/workflows/aws-deploy.yml
    with:
      environment: staging
      stack-name: GuideStagingStack
    secrets: inherit

  # staging を使っていない（スキップされた）ときも production へは進めるよう、
  # needs の既定の「全部成功」ではなく結果を個別に見る。staging が失敗したら production は動かさない。
  deploy-production:
    needs: [validate, runtime-image, infra-test, deploy-staging]
    if: >-
      ${{
        !cancelled()
        && github.event_name == 'push' && github.ref == 'refs/heads/main'
        && vars.AWS_DEPLOY_ENABLED == 'true'
        && needs.validate.result == 'success'
        && needs.runtime-image.result == 'success'
        && needs.infra-test.result == 'success'
        && (needs.deploy-staging.result == 'success' || needs.deploy-staging.result == 'skipped')
      }}
    uses: ./.github/workflows/aws-deploy.yml
    with:
      environment: production
      stack-name: GuideStack
    secrets: inherit

  # mainへのpushでいずれかのジョブが失敗したときだけSlackへ通知する。報告専用で、ワークフローの成否は変えない。
  # deploy-* はmain以外ではスキップされるため、always() と contains(needs.*.result, 'failure') の
  # 組み合わせでスキップを失敗扱いしない。
  # 通知をmainに限るのは意図的。pull_requestの失敗はPR画面で見えるので除いているが、
  # PRブランチへのpushはpushイベントも起こすため、ref を絞らないと同じコミットが結局通知され、
  # 障害用チャンネルが日常の開発CI失敗で埋まる。feature ブランチの失敗はActions画面で見る。
  # （同じ理由の通知を .github/workflows/dependency-security.yml にも置いている。
  #   共通化せず意図的に複製している。理由はあちら側のコメントを参照。）
  # このジョブがgreenの実行を赤くすることはない。needsのどれかが既にfailureのときだけ走り、
  # かつこのファイルのどのジョブも continue-on-error を使っていないため（使うと失敗が
  # success扱いになり、この前提が崩れる）。continue-on-error は足さない。送信失敗を隠してしまう。
  notify-failure:
    runs-on: ubuntu-latest
    needs: [validate, runtime-image, infra-test, deploy-staging, deploy-production]
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(needs.*.result, 'failure') }}
    steps:
      - name: Slackへ失敗を通知
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          WORKFLOW_NAME: ${{ github.workflow }}
          NEEDS_JSON: ${{ toJSON(needs) }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
          ACTOR: ${{ github.actor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          # シークレットが未登録のあいだは何もせず正常終了する（通知の有無でCIを落とさない）。
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "シークレット SLACK_WEBHOOK_URL が未登録のため、Slack通知を省略します"
            exit 0
          fi

          failed_jobs=$(printf '%s' "$NEEDS_JSON" | jq -r '
            to_entries
            | map(select(.value.result == "failure") | .key)
            | join(", ")')

          payload=$(jq -n \
            --arg workflow "$WORKFLOW_NAME" \
            --arg jobs "$failed_jobs" \
            --arg ref "$REF_NAME" \
            --arg sha "$COMMIT_SHA" \
            --arg actor "$ACTOR" \
            --arg url "$RUN_URL" \
            '{text: ":rotating_light: \($workflow) が失敗しました\n失敗ジョブ: \($jobs)\nブランチ: \($ref)\nコミット: \($sha)\n実行者: \($actor)\n実行ログ: \($url)"}')

          curl --fail --silent --show-error --max-time 5 \
            --request POST \
            --header 'Content-Type: application/json' \
            --data "$payload" \
            "$SLACK_WEBHOOK_URL"
